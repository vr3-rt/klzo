<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM.VOID // TR SD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Custom Cyber Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Matrix Red Code Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay & CRT Lines -->
    <div class="overlay"></div>

    <!-- Audio Player -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a221b2.mp3" type="audio/mpeg">
    </audio>

    <!-- Header Wrapper -->
    <div class="top-header-wrapper">
        <div class="hud-box top-left-box">
            <div class="box-header">
                <span class="dot red"></span>
                <span class="title">SOUL.INTEGRITY</span>
            </div>
            <div class="box-content">
                <p>> ALL_IS_DARK // 0x3070</p>
            </div>
        </div>

        <div class="hud-box top-right-music">
            <button id="music-btn" onclick="toggleMusic()">
                <i class="fa-solid fa-play" id="play-icon"></i>
                <span id="song-title">419 & HEARTBREAK</span>
            </button>
            <div class="audio-wave">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Main Center Hero Section -->
    <div class="hero-container">
        <div class="wings-wrapper">
            <span class="wing left-wing">🪽</span>
            <h1 class="main-title">TR SD</h1>
            <span class="wing right-wing">🪽</span>
        </div>
        <!-- Typing Effect Target -->
        <p class="subtitle"><span id="typed-text"></span><span class="cursor-blink">|</span></p>
        <p class="tagline">Liberate . Digital . Dark</p>
    </div>

    <!-- Bottom Dashboard -->
    <div class="bottom-dashboard">
        <div class="bottom-left-widgets">
            <div class="hud-box clock-box">
                <div id="clock-time">00:00:00</div>
                <div id="clock-date">SAT 15 AUG 2026</div>
            </div>

            <div class="hud-box profile-card">
                <img src="https://i.pinimg.com/736x/87/42/1d/87421d033db7faec0f32cfcd0ff64e32.jpg" alt="Red Spider Avatar" class="mini-avatar">
                <div class="profile-details">
                    <div class="status-indicator"><span class="status-dot"></span> online</div>
                    <div class="username">tr._.sd</div>
                </div>
            </div>
        </div>

        <div class="bottom-center-links">
            <div class="links-hud">
                <a href="https://open.spotify.com/user/31stripkxmrpjbh3ucbml4ylcpna" target="_blank"><i class="fa-brands fa-spotify"></i> SPOTIFY</a>
                <a href="https://www.tiktok.com/@tr._.sd" target="_blank"><i class="fa-brands fa-tiktok"></i> TIKTOK</a>
                <a href="https://discord.com/users/1420458027441590382" target="_blank"><i class="fa-brands fa-discord"></i> DISCORD</a>
                <a href="https://steamcommunity.com/profiles/76561198728B32429/" target="_blank"><i class="fa-brands fa-steam"></i> STEAM</a>
                <a href="https://github.com/vr3-rt" target="_blank"><i class="fa-brands fa-github"></i> GITHUB</a>
            </div>
            <p class="footer-note">✝ Darkness awaits you ✝</p>
        </div>

        <div class="hud-box bottom-right-bpm">
            <div class="bpm-header">
                <span>HEART</span>
                <span class="bpm-val">BPM 64</span>
            </div>
            <div class="ecg-graph">
                <svg viewBox="0 0 150 40">
                    <path d="M 0,20 L 30,20 L 35,5 L 40,35 L 45,10 L 50,25 L 55,20 L 150,20" fill="none" stroke="#ff003c" stroke-width="1.5" />
                </svg>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Audio Toggle
        function toggleMusic() {
            var music = document.getElementById("bg-music");
            var icon = document.getElementById("play-icon");
            var wave = document.querySelector(".audio-wave");
            
            if (music.paused) {
                music.play();
                icon.className = "fa-solid fa-pause";
                wave.classList.add("playing");
            } else {
                music.pause();
                icon.className = "fa-solid fa-play";
                wave.classList.remove("playing");
            }
        }

        // Clock
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 1. Custom Cyber Cursor Script
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;
            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 250, fill: "forwards" });
        });

        // 2. Terminal Typing Effect
        const textToType = "ARCHITECT OF DIGITAL MADNESS";
        let typeIndex = 0;
        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("typed-text").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, 80);
            }
        }
        window.onload = typeWriter;

        // 3. Red Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEF';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const rainDrops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff003c';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
